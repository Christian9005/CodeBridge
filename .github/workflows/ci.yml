name: CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Pack NuGet packages and build VSIX
        shell: pwsh
        run: ./build/pack.ps1 -Vsix

      - name: VSIX smoke test
        shell: pwsh
        run: ./tests/smoke_test.ps1 -VsixPath artifacts/vsix/CodeBridge.VisualStudio.vsix

      - name: Build solution
        run: dotnet build CodeBridge.slnx -c Release

      - name: Test
        run: dotnet test CodeBridge.slnx -c Release --no-build --verbosity normal

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vsix-extension
          path: artifacts/vsix/*.vsix

  # The MAUI sample needs the .NET 10 SDK and the MAUI workload, so it is built on its own (it is not part of CodeBridge.slnx).
  maui-sample:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install the MAUI workload
        run: dotnet workload install maui

      - name: Build the MAUI sample (Windows)
        run: dotnet build samples/Integration.Maui -f net10.0-windows10.0.19041.0 -c Release

  firmware:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { project: esp32-bridge, env: esp32 }
          - { project: esp32-bridge, env: esp32s3 }
          - { project: esp32-bridge, env: esp32c3 }
          - { project: esp32-bridge, env: xiao_esp32s3 }
          - { project: esp32-bridge, env: esp32s2 }
          - { project: arduino-uno-bridge, env: uno }
          - { project: arduino-uno-bridge, env: nano }
          - { project: arduino-uno-bridge, env: mega }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install platformio
      - name: Build firmware
        run: pio run -d firmware/${{ matrix.project }} -e ${{ matrix.env }}
