name: Release

# Push a tag such as v0.5.0 (it must match <Version> in Directory.Build.props).
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write
  id-token: write   # NuGet trusted publishing: GitHub proves who is pushing, no long-lived API key is stored

jobs:
  release:
    runs-on: windows-latest
    # Holds the NUGET_USER secret (the nuget.org profile name). Create it once in Settings > Environments.
    environment: release
    env:
      NUGET_USER: ${{ secrets.NUGET_USER }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Verify tag matches product version
        shell: pwsh
        run: |
          $version = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          if ("v$version" -ne "${{ github.ref_name }}") { throw "Tag ${{ github.ref_name }} does not match Directory.Build.props version v$version" }
          "PRODUCT_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Pack NuGet packages and build VSIX
        shell: pwsh
        run: ./build/pack.ps1 -Vsix

      - name: Test
        run: dotnet test CodeBridge.slnx -c Release

      # Trusted publishing: nuget.org must have a policy for this repository and this workflow file (release.yml).
      - name: NuGet login (trusted publishing)
        id: nuget-login
        if: ${{ env.NUGET_USER != '' }}
        uses: NuGet/login@v1
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push NuGet packages
        if: ${{ steps.nuget-login.outcome == 'success' }}
        shell: pwsh
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: |
          Get-ChildItem artifacts/packages -Filter "*.$($env:PRODUCT_VERSION).nupkg" | ForEach-Object {
            dotnet nuget push $_.FullName --api-key $env:NUGET_API_KEY --source https://api.nuget.org/v3/index.json --skip-duplicate
            if ($LASTEXITCODE -ne 0) { throw "dotnet nuget push failed for $($_.Name)" }
          }

      - name: NuGet skipped
        if: ${{ env.NUGET_USER == '' }}
        shell: pwsh
        run: Write-Warning 'NUGET_USER is not set in the "release" environment - nothing was pushed to nuget.org'

      - name: Publish to Visual Studio Marketplace
        shell: pwsh
        env:
          VS_MARKETPLACE_PAT: ${{ secrets.VS_MARKETPLACE_PAT }}
        run: |
          if (-not $env:VS_MARKETPLACE_PAT) { Write-Warning 'VS_MARKETPLACE_PAT not set - skipping Marketplace publish'; exit 0 }
          if (-not (Get-Content vs-publish.json -Raw | ConvertFrom-Json).publisher) { throw 'vs-publish.json has an empty "publisher": put your Marketplace publisher ID there (and in the vsixmanifest) first' }
          $publisher = Get-ChildItem "${env:ProgramFiles}\Microsoft Visual Studio" -Recurse -Filter VsixPublisher.exe | Select-Object -First 1
          if (-not $publisher) { throw 'VsixPublisher.exe not found on this runner' }
          & $publisher.FullName publish -payload artifacts/vsix/CodeBridge.VisualStudio.vsix -publishManifest vs-publish.json -personalAccessToken $env:VS_MARKETPLACE_PAT -ignoreWarnings "VSIXValidatorWarning01,VSIXValidatorWarning02,VSIXValidatorWarning08"
          if ($LASTEXITCODE -ne 0) { throw "VsixPublisher failed ($LASTEXITCODE)" }

      - name: GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            artifacts/vsix/*.vsix
            artifacts/packages/*.nupkg
