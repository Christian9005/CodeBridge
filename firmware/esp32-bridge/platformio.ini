; CodeBridge Firmware for ESP32
; This firmware runs on the ESP32 and acts as a bridge between
; the .NET SDK (running on PC) and the hardware peripherals.
;
; One source, one environment per chip. Build one with:  pio run -e esp32s3
; (the prebuilt images in ../prebuilt are produced from these environments)

[env]
; Pinned: espressif32 6.10.0 is Arduino-ESP32 2.0.17 (ESP-IDF 4.4). Newer releases bring Arduino core 3, whose ledc and
; watchdog APIs differ; move up on purpose, with the code, not because a build machine picked the latest.
platform = espressif32 @ 6.10.0
framework = arduino
monitor_speed = 115200
lib_deps =
    bblanchon/ArduinoJson@^7
    paulstoffregen/OneWire@^2.3
    milesburton/DallasTemperature@^3.11
    adafruit/Adafruit NeoPixel@^1.12
    madhephaestus/ESP32Servo@^3.0
    adafruit/Adafruit SSD1306@^2.5
    adafruit/Adafruit GFX Library@^1.11
    marcoschwartz/LiquidCrystal_I2C@^1.1
    adafruit/Adafruit BME280 Library@^2.2
    claws/BH1750@^1.3
    adafruit/Adafruit MPU6050@^2.2
    adafruit/Adafruit TCS34725@^1.4
    adafruit/Adafruit INA219@^1.2
    knolleary/PubSubClient@^2.8

[env:esp32]
board = esp32dev
upload_speed = 460800

[env:esp32s3]
board = esp32-s3-devkitc-1
upload_speed = 460800

[env:esp32c3]
board = esp32-c3-devkitm-1
upload_speed = 460800

; Boards whose only USB port is the chip's own USB (no UART bridge chip): Serial must be the USB serial port.
[env:xiao_esp32s3]
board = seeed_xiao_esp32s3
upload_speed = 460800

[env:esp32s2]
board = lolin_s2_mini
upload_speed = 460800

; Other boards: change the board of one environment, for example
; board = nodemcu-32s
